name: luksMusic
options:
  bundleIdPrefix: com.lukstrike
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    OTHER_SWIFT_FLAGS: "-suppress-warnings"

packages:
  AudioKit:
    url: https://github.com/AudioKit/AudioKit
    from: "5.6.0"
  Tonic:
    url: https://github.com/AudioKit/Tonic
    from: "2.0.0"

targets:
  luksMusic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: luksMusic
        excludes:
          - Info.plist
    info:
      path: luksMusic/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: "AppIcon"
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "luksMusic needs access to the camera to scan and digitize printed sheet music using OCR."
        NSMicrophoneUsageDescription: "luksMusic needs access to the microphone to listen to your instrument for practice feedback and tuning."
        NSPhotoLibraryUsageDescription: "luksMusic needs access to your photo library to import images of sheet music for OCR scanning."
        NSPhotoLibraryAddUsageDescription: "luksMusic needs permission to save exported score images to your photo library."
        NSDocumentsFolderUsageDescription: "luksMusic needs access to your documents to import and export MusicXML score files."
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UISupportsDocumentBrowser: true
    entitlements:
      path: luksMusic/luksMusic.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukstrike.luksMusic
        INFOPLIST_FILE: luksMusic/Info.plist
        CURRENT_PROJECT_VERSION: "12"
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: true
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: AudioKit
      - package: Tonic

schemes:
  luksMusic:
    build:
      targets:
        luksMusic: all
    run:
      config: Debug
      commandLineArguments:
        "-com.apple.CoreData.ConcurrencyDebug 1": true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

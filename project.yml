name: luksMusic
options:
  bundleIdPrefix: com.lukstrike
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    OTHER_SWIFT_FLAGS: "-suppress-warnings"

packages:
  AudioKit:
    url: https://github.com/AudioKit/AudioKit
    from: "5.6.0"
  Tonic:
    url: https://github.com/AudioKit/Tonic
    from: "2.0.0"

targets:
  luksMusic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: luksMusic
        excludes:
          - Info.plist
          - ScoreViewer
      # Score renderer page and OpenSheetMusicDisplay, loaded into a WKWebView from the bundle
      - path: luksMusic/ScoreViewer
        buildPhase: resources
    info:
      path: luksMusic/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: "AppIcon"
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "luksMusic needs access to the microphone to listen to your instrument for practice feedback and tuning."
        NSDocumentsFolderUsageDescription: "luksMusic needs access to your documents to import and export MusicXML score files."
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UISupportsDocumentBrowser: true
    entitlements:
      path: luksMusic/luksMusic.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukstrike.luksMusic
        INFOPLIST_FILE: luksMusic/Info.plist
        # XcodeGen's iOS preset sets "1,2" on the target, which would override the project-level iPhone-only value
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "19"
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: true
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: AudioKit
      - package: Tonic

  luksMusicUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: luksMusicUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukstrike.luksMusicUITests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: luksMusic

schemes:
  luksMusic:
    build:
      targets:
        luksMusic: all
    test:
      config: Debug
      targets:
        - luksMusicUITests
    run:
      config: Debug
      commandLineArguments:
        "-com.apple.CoreData.ConcurrencyDebug 1": true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

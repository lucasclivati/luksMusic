name: Deploy to TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          if [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          elif [ -d "/Applications/Xcode_26.1.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.1.1.app
          elif [ -d "/Applications/Xcode_26.0.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.1.app
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Install Apple Distribution Certificate
        env:
          APPLE_DIST_CERTIFICATE_P12: ${{ secrets.APPLE_DIST_CERTIFICATE_P12 }}
          APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="temp_runner_password"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          echo "$APPLE_DIST_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          
          # Convert modern PKCS#12 to legacy format compatible with macOS security import
          openssl pkcs12 -in $RUNNER_TEMP/cert.p12 -nodes -passin pass:"$APPLE_DIST_P12_PASSWORD" -out $RUNNER_TEMP/cert.pem
          openssl pkcs12 -export -in $RUNNER_TEMP/cert.pem -out $RUNNER_TEMP/cert-legacy.p12 -passout pass:"$APPLE_DIST_P12_PASSWORD" -legacy || \
          openssl pkcs12 -export -in $RUNNER_TEMP/cert.pem -out $RUNNER_TEMP/cert-legacy.p12 -passout pass:"$APPLE_DIST_P12_PASSWORD"
          
          security import $RUNNER_TEMP/cert-legacy.p12 -k $KEYCHAIN_PATH -P "$APPLE_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

      - name: Build Archive for App Store
        run: |
          xcodebuild archive \
            -project luksMusic.xcodeproj \
            -scheme luksMusic \
            -configuration Release \
            -archivePath build/luksMusic.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export and Sign IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/luksMusic.xcarchive/Products/Applications/luksMusic.app build/ipa/Payload/
          cp embedded.mobileprovision build/ipa/Payload/luksMusic.app/embedded.mobileprovision
          
          # Explicitly set CFBundleVersion to 9
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 9" build/ipa/Payload/luksMusic.app/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 9" build/ipa/Payload/luksMusic.app/Info.plist
          echo "Verified CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/ipa/Payload/luksMusic.app/Info.plist)"
          
          # Copy Piano SoundFont and App Icons into app root
          cp luksMusic/Piano.sf2 build/ipa/Payload/luksMusic.app/Piano.sf2 || true
          cp luksMusic/GoogleService-Info.plist build/ipa/Payload/luksMusic.app/GoogleService-Info.plist || true
          cp luksMusic/icon-120.png build/ipa/Payload/luksMusic.app/AppIcon60x60@2x.png || true
          cp luksMusic/icon-152.png build/ipa/Payload/luksMusic.app/AppIcon76x76@2x~ipad.png || true
          cp luksMusic/icon-167.png build/ipa/Payload/luksMusic.app/AppIcon83.5x83.5@2x~ipad.png || true
          cp luksMusic/icon-1024.png build/ipa/Payload/luksMusic.app/AppIcon1024x1024.png || true
          
          # Extract entitlements directly from provisioning profile
          security cms -D -i embedded.mobileprovision > build/profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' build/profile.plist > build/entitlements.plist
          
          # Sign embedded frameworks if any exist
          if [ -d "build/ipa/Payload/luksMusic.app/Frameworks" ]; then
            for framework in build/ipa/Payload/luksMusic.app/Frameworks/*; do
              if [ -e "$framework" ]; then
                /usr/bin/codesign --force --sign "Apple Distribution" --timestamp "$framework"
              fi
            done
          fi
          
          # Sign main app bundle
          /usr/bin/codesign --force --sign "Apple Distribution" --entitlements build/entitlements.plist --timestamp --generate-entitlement-der build/ipa/Payload/luksMusic.app
          
          # Verify signature
          /usr/bin/codesign -vvv --deep --strict build/ipa/Payload/luksMusic.app
          
          cd build/ipa
          zip -qr ../luksMusic-TestFlight.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luksMusic-TestFlight-ipa
          path: build/luksMusic-TestFlight.ipa

      - name: Upload to TestFlight (App Store Connect)
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          xcrun altool --upload-app \
            -f build/luksMusic-TestFlight.ipa \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

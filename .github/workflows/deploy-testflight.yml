name: Deploy to TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  testflight:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive for App Store
        run: |
          xcodebuild archive \
            -project luksMusic.xcodeproj \
            -scheme luksMusic \
            -configuration Release \
            -archivePath build/luksMusic.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/luksMusic.xcarchive/Products/Applications/luksMusic.app build/ipa/Payload/
          cd build/ipa
          zip -qr ../luksMusic-TestFlight.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luksMusic-TestFlight-ipa
          path: build/luksMusic-TestFlight.ipa

      - name: Upload to TestFlight (App Store Connect)
        if: env.APP_STORE_CONNECT_API_KEY != ''
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          xcrun altool --upload-app \
            -f build/luksMusic-TestFlight.ipa \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4">
  <title>luksMusic Pages</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b1120;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Scrolls in both directions itself, so a zoomed-in page never widens the document */
    #viewport {
      position: fixed;
      inset: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    #pages {
      box-sizing: border-box;
      width: 100%;
      padding: 8px 6px 24px;
    }
    /* A page cropped to its music: the side margins of the engraving are cut so the staves fill the phone */
    .page {
      position: relative;
      overflow: hidden;
      margin: 0 0 10px;
      background: #ffffff;
      border-radius: 3px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
    }
    .sheet {
      position: relative;
    }
    .sheet img {
      display: block;
      width: 100%;
      height: auto;
    }
    .measure-box {
      position: absolute;
      display: none;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 3px;
      pointer-events: none;
    }
    .cursor {
      position: absolute;
      display: none;
      width: 3px;
      transform: translateX(-50%);
      background: #2563eb;
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.8);
      border-radius: 1px;
      pointer-events: none;
    }
    .cursor::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      width: 11px;
      height: 11px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #ffffff;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.9);
    }
  </style>
</head>
<body>
  <div id="viewport"><div id="pages"></div></div>
  <script>
    // Shows a score's original engraved pages (as on luksmusic.web.app) with the cursor on the notehead of the
    // current onset, using the score's MEASURE_LAYOUT and NOTE_COLUMNS. The app drives it through luks.update();
    // taps go back as {type: "seek", measure, beat}.
    const post = (message) => {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.luks) {
        window.webkit.messageHandlers.luks.postMessage(message);
      }
    };

    // Same padding the web player draws around the current measure (percent of the page)
    const PAD_TOP = 1.2;
    const PAD_HEIGHT = 2.4;

    let state = {};
    let layout = [];
    let columns = {};
    let pages = [];

    // Horizontal span of the music on the pages (percent), keeping room for the brace and measure numbers
    function cropWindow() {
      if (!layout.length) return { left: 0, right: 100 };
      const left = Math.min(...layout.map((m) => m.left_pct));
      const right = Math.max(...layout.map((m) => m.left_pct + m.width_pct));
      return { left: Math.max(0, left - 6), right: Math.min(100, right + 1.5) };
    }

    function build() {
      const root = document.getElementById("pages");
      root.innerHTML = "";
      const crop = cropWindow();
      const span = crop.right - crop.left;
      pages = (state.pages || []).map((url, i) => {
        const page = document.createElement("div");
        page.className = "page";
        const sheet = document.createElement("div");
        sheet.className = "sheet";
        sheet.style.width = `${10000 / span}%`;
        sheet.style.marginLeft = `${-100 * crop.left / span}%`;
        const img = document.createElement("img");
        img.src = url;
        img.alt = `Página ${i + 1}`;
        img.addEventListener("load", () => place(false));
        const box = document.createElement("div");
        box.className = "measure-box";
        const cursor = document.createElement("div");
        cursor.className = "cursor";
        sheet.append(img, box, cursor);
        page.append(sheet);
        sheet.addEventListener("click", (event) => tap(i + 1, sheet, event));
        root.append(page);
        return { page, sheet, box, cursor };
      });
    }

    // Latest onset at or before `beat`, so the cursor always rests on a notehead
    function columnAt(number, beat) {
      const cols = columns[number];
      if (!cols || !cols.length) return null;
      let col = cols[0];
      for (const c of cols) {
        if (c[0] <= beat + 0.001) col = c;
      }
      return col;
    }

    function place(scroll) {
      pages.forEach((p) => {
        p.box.style.display = "none";
        p.cursor.style.display = "none";
      });
      const number = (state.measure || 0) + 1;
      const m = layout.find((x) => x.number === number);
      if (!m || !pages[m.page - 1]) return;
      const p = pages[m.page - 1];
      const top = Math.max(0, m.top_pct - PAD_TOP);
      const height = m.height_pct + PAD_HEIGHT;
      Object.assign(p.box.style, { display: "block", left: `${m.left_pct}%`, top: `${top}%`, width: `${m.width_pct}%`, height: `${height}%` });
      const col = columnAt(number, state.beat || 1);
      const fraction = Math.max(0, Math.min(1, ((state.beat || 1) - 1) / (state.beatsPerMeasure || 4)));
      const left = col ? col[1] : m.left_pct + fraction * m.width_pct;
      Object.assign(p.cursor.style, { display: "block", left: `${left}%`, top: `${top}%`, height: `${height}%` });
      if (scroll) keepInView(p.sheet, left, top, height);
    }

    // Scrolls just enough to show the current measure, and follows the cursor sideways when zoomed in
    function keepInView(sheet, leftPct, topPct, heightPct) {
      const viewport = document.getElementById("viewport");
      const frame = viewport.getBoundingClientRect();
      const rect = sheet.getBoundingClientRect();
      const y1 = rect.top - frame.top + rect.height * topPct / 100;
      const y2 = rect.top - frame.top + rect.height * (topPct + heightPct) / 100;
      const x = rect.left - frame.left + rect.width * leftPct / 100;
      const width = viewport.clientWidth;
      let top = viewport.scrollTop;
      let left = viewport.scrollLeft;
      if (y1 < 8 || y2 > viewport.clientHeight - 8) {
        top = Math.max(0, viewport.scrollTop + y1 - 12);
      }
      if (x < width * 0.15 || x > width * 0.8) {
        left = Math.max(0, viewport.scrollLeft + x - width * 0.3);
      }
      if (top !== viewport.scrollTop || left !== viewport.scrollLeft) {
        viewport.scrollTo({ top, left, behavior: "smooth" });
      }
    }

    // Tap: the system under the finger, the measure by x, then that measure's closest note
    function tap(pageNumber, sheet, event) {
      const rect = sheet.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width * 100;
      const y = (event.clientY - rect.top) / rect.height * 100;
      const onPage = layout.filter((m) => m.page === pageNumber);
      if (!onPage.length) return;
      const distance = (m) => y < m.top_pct ? m.top_pct - y : (y > m.top_pct + m.height_pct ? y - m.top_pct - m.height_pct : 0);
      const nearest = Math.min(...onPage.map(distance));
      const row = onPage.filter((m) => distance(m) - nearest < 0.5);
      const m = row.find((r) => x >= r.left_pct && x <= r.left_pct + r.width_pct)
        || row.reduce((a, b) => Math.abs(a.left_pct + a.width_pct / 2 - x) < Math.abs(b.left_pct + b.width_pct / 2 - x) ? a : b);
      const cols = columns[m.number] || [];
      const col = cols.length ? cols.reduce((a, c) => Math.abs(c[1] - x) < Math.abs(a[1] - x) ? c : a) : [1, 0];
      post({ type: "seek", measure: m.number - 1, beat: col[0] });
    }

    function applyZoom() {
      document.getElementById("pages").style.width = `${(state.zoom || 1) * 100}%`;
    }

    window.luks = {
      update(next) {
        const rebuild = next.pages !== undefined && JSON.stringify(next.pages) !== JSON.stringify(state.pages);
        if (next.layout) layout = next.layout;
        if (next.columns) columns = next.columns;
        const moved = next.measure !== state.measure || next.beat !== state.beat;
        const zoomed = next.zoom !== undefined && next.zoom !== state.zoom;
        state = { ...state, ...next };
        if (rebuild) build();
        if (zoomed) applyZoom();
        if (rebuild || moved || zoomed) place(!rebuild);
      },
    };

    post({ type: "loaded" });
  </script>
</body>
</html>

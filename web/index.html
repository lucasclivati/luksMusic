<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luksMusic - Dark Dream (MuseScore Exact Score 1-31)</title>
    <link rel="stylesheet" href="bravura.css">
    <!-- Tone.js for Sampled Concert Grand Piano -->
    <script src="Tone.js"></script>
    <style>
        :root {
            --app-bg: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --accent-blue: #3b82f6;
            --accent-cyan: #38bdf8;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --paper-bg: #ffffff;
            --ink-color: #000000;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--app-bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. TOP HEADER */
        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            padding: 8px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
            height: 54px;
            flex-shrink: 0;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: white;
            font-weight: 800;
            font-size: 13px;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .song-info h1 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .song-info p {
            margin: 1px 0 0;
            font-size: 11px;
            color: var(--text-muted);
        }

        .playback-main-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button.btn-ctrl {
            background: #334155;
            color: #f1f5f9;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        button.btn-ctrl:hover {
            background: #475569;
            color: #ffffff;
        }

        button.btn-ctrl.active {
            background: #1e3a8a;
            border-color: var(--accent-blue);
            color: #93c5fd;
        }

        button.btn-play-hero {
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: transform 0.15s;
        }

        button.btn-play-hero:hover {
            transform: scale(1.06);
            background: #2563eb;
        }

        .metronome-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
            display: inline-block;
            transition: background 0.05s ease;
        }
        .metronome-dot.flash-downbeat {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }
        .metronome-dot.flash-subbeat {
            background: #eab308;
            box-shadow: 0 0 8px #eab308;
        }

        .header-tools {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .speed-selector {
            display: flex;
            align-items: center;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 2px;
        }

        .speed-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
        }

        .speed-btn.active {
            background: #334155;
            color: #38bdf8;
        }

        .audio-status {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            background: #14532d;
            color: #86efac;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 2. MAIN WORKSPACE: SCORE SCROLL AREA (100% UNOBSTRUCTED) */
        .score-scroll-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
            background: #334155;
            padding: 24px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 36px;
        }

        .sheet-paper {
            background: var(--paper-bg);
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
            padding: 28px 44px 40px;
            border-radius: 3px;
            min-width: 960px;
            max-width: 1040px;
            width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: relative;
        }

        .page-badge {
            position: absolute;
            top: 14px;
            right: 24px;
            font-family: serif;
            font-size: 14px;
            font-weight: bold;
            color: #475569;
        }

        /* System Rows */
        .system-row {
            display: flex;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        
        .bravura { font-family: 'Bravura', serif; }
        .music-text { font-family: 'Edwin', 'Liberation Serif', 'DejaVu Serif', 'Times New Roman', serif; }

        svg.system-svg {
            width: 100%;
            height: 220px;
            overflow: visible;
        }

        .playback-cursor {
            position: absolute;
            top: 24px;
            width: 3px;
            height: 175px;
            background: #2563eb;
            opacity: 0.55;
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.6);
            pointer-events: none;
            transition: left 0.03s linear;
            display: none;
            z-index: 10;
        }

        /* 3. BOTTOM DOCK: SCRUBBER + HANDS MIXER & PIANO KEYBOARD TOGETHER */
        .bottom-dock {
            background: #111827;
            border-top: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            z-index: 25;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }

        .timeline-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 6px 24px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }

        .time-display {
            font-family: monospace;
            font-size: 12px;
            font-weight: 600;
            color: #38bdf8;
            min-width: 85px;
        }

        .measure-badge-btn {
            background: #0f172a;
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .scrubber-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            border-radius: 3px;
            background: #334155;
            outline: none;
            cursor: pointer;
        }

        .scrubber-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
            box-shadow: 0 0 6px rgba(59, 130, 246, 0.8);
        }

        /* Bottom Controls Row: Mixer Integrated Beside Piano */
        .dock-controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 8px 16px 10px;
            background: linear-gradient(180deg, #182234 0%, #0d131f 100%);
        }

        /* Embedded Compact Mixer Panel (Never covers sheet!) */
        .bottom-mixer-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 12px;
            width: 250px;
            flex-shrink: 0;
        }

        .mixer-title-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            color: #cbd5e1;
            border-bottom: 1px solid #334155;
            padding-bottom: 4px;
        }

        .hand-control-strip {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
        }

        .hand-control-strip span.hand-name {
            width: 75px;
            font-weight: 600;
            white-space: nowrap;
        }

        .btn-mute, .btn-solo {
            background: #334155;
            border: none;
            color: #94a3b8;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-mute.active { background: #dc2626; color: white; }
        .btn-solo.active { background: #eab308; color: black; }

        .hand-control-strip input[type="range"] {
            flex: 1;
            height: 3px;
            accent-color: var(--accent-blue);
        }

        /* 61-Key Virtual Piano Frame */
        .keyboard-frame {
            position: relative;
            display: flex;
            background: #000000;
            padding: 4px 6px;
            border-radius: 6px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 4px 14px rgba(0,0,0,0.6);
            height: 88px;
            overflow: visible;
        }

        .white-key {
            width: 22px;
            height: 80px;
            background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
            border: 1px solid #94a3b8;
            border-radius: 0 0 3px 3px;
            position: relative;
            cursor: pointer;
            z-index: 1;
            box-shadow: inset 0 -3px 4px rgba(0,0,0,0.15);
            transition: background 0.05s ease;
        }

        .white-key.active-rh {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%) !important;
            box-shadow: 0 0 10px #38bdf8 !important;
        }

        .white-key.active-lh {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%) !important;
            box-shadow: 0 0 10px #4ade80 !important;
        }

        .white-key-label {
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            font-weight: 700;
            color: #64748b;
            pointer-events: none;
        }

        .black-key {
            width: 13px;
            height: 50px;
            background: linear-gradient(180deg, #334155 0%, #0f172a 100%);
            border: 1px solid #000000;
            border-radius: 0 0 3px 3px;
            position: absolute;
            z-index: 2;
            cursor: pointer;
            box-shadow: 1px 2px 4px rgba(0,0,0,0.6);
            transition: background 0.05s ease;
        }

        .black-key.active-rh {
            background: #0284c7 !important;
            box-shadow: 0 0 8px #38bdf8 !important;
        }

        .black-key.active-lh {
            background: #15803d !important;
            box-shadow: 0 0 8px #4ade80 !important;
        }
    </style>
</head>
<body>

    <!-- 1. HEADER -->
    <header>
        <div class="brand-section">
            <span class="brand-badge">luksMusic</span>
            <div class="song-info">
                <h1>DARK DREAM (LOTM ED)</h1>

            </div>

        <div class="playback-main-controls">

            <button id="playBtn" class="btn-play-hero" title="Tocar / Pausar">▶</button>
            <button id="loopBtn" class="btn-ctrl" title="Repetir Seção A-B">🔁 Loop</button>

        <div class="header-tools">
            <div class="speed-selector">

        // -------------------------------------------------------------
        // 2. AUDIO ENGINE (Tone.js Sampler + Fallback Synth)
        // -------------------------------------------------------------
        class AudioPlayer {
            constructor() {
                this.isToneReady = false;
                this.sampler = null;
                this.rhGain = null;
                this.lhGain = null;
                this.synthCtx = null;
                this.rhVol = 0.9;
                this.lhVol = 0.85;
                this.rhMute = false;
                this.lhMute = false;
                this.rhSolo = false;
                this.lhSolo = false;
            }

            async init() {
                if (this.isToneReady) return;

                if (window.Tone) {
                    try {
                        await Tone.start();
                        this.rhGain = new Tone.Gain(this.rhVol).toDestination();
                        this.lhGain = new Tone.Gain(this.lhVol).toDestination();

                        const sampleUrls = {
                            "A0": "A0.mp3", "C1": "C1.mp3", "D#1": "Ds1.mp3", "F#1": "Fs1.mp3", "A1": "A1.mp3",
                            "C2": "C2.mp3", "D#2": "Ds2.mp3", "F#2": "Fs2.mp3", "A2": "A2.mp3",
                            "C3": "C3.mp3", "D#3": "Ds3.mp3", "F#3": "Fs3.mp3", "A3": "A3.mp3",
                            "C4": "C4.mp3", "D#4": "Ds4.mp3", "F#4": "Fs4.mp3", "A4": "A4.mp3",
                            "C5": "C5.mp3", "D#5": "Ds5.mp3", "F#5": "Fs5.mp3", "A5": "A5.mp3",
                            "C6": "C6.mp3", "D#6": "Ds6.mp3", "F#6": "Fs6.mp3", "A6": "A6.mp3",
                            "C7": "C7.mp3", "D#7": "Ds7.mp3", "F#7": "Fs7.mp3", "A7": "A7.mp3", "C8": "C8.mp3"
                        };

                        this.sampler = new Tone.Sampler({
                            urls: sampleUrls,
                            baseUrl: "audio/salamander/",
                            onload: () => {
                                const badge = document.getElementById("audioStatusBadge");
                                badge.innerHTML = `<span>●</span> Steinway Grand (Loaded)`;
                                badge.style.background = "#14532d";
                                badge.style.color = "#86efac";
                            }
                        });

                        this.sampler.connect(this.rhGain);
                        this.sampler.connect(this.lhGain);
                        this.isToneReady = true;
                    } catch (e) {
                        this.initSynthFallback();
                    }
                } else {
                    this.initSynthFallback();
                }
            }

            initSynthFallback() {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.synthCtx = new AudioCtx();
                this.masterGain = this.synthCtx.createGain();
                this.masterGain.gain.value = 0.8;
                this.masterGain.connect(this.synthCtx.destination);
            }

            playChord(midiArray, duration = 0.6, velocity = 0.8, isRightHand = true) {
                let shouldPlay = true;
                if (isRightHand) {
                    if (this.rhMute) shouldPlay = false;
                    if (this.lhSolo && !this.rhSolo) shouldPlay = false;
                } else {
                    if (this.lhMute) shouldPlay = false;
                    if (this.rhSolo && !this.lhSolo) shouldPlay = false;
                }

                if (!shouldPlay) return;

                const handVol = isRightHand ? this.rhVol : this.lhVol;
                const effectiveVel = velocity * handVol;

                midiArray.forEach((midi) => {
                    const noteName = this.midiToNoteName(midi);
                    if (this.sampler && this.sampler.loaded) {
                        this.sampler.triggerAttackRelease(noteName, duration, undefined, effectiveVel);
                    } else {
                        this.playSynthNote(midi, duration, effectiveVel);
                    }
                });
            }

            playSynthNote(midi, duration, velocity) {
                if (!this.synthCtx) this.initSynthFallback();
                if (this.synthCtx.state === "suspended") this.synthCtx.resume();

                const freq = 440 * Math.pow(2, (midi - 69) / 12);
                const now = this.synthCtx.currentTime;

                const osc = this.synthCtx.createOscillator();
                const gain = this.synthCtx.createGain();

                osc.type = "triangle";
                osc.frequency.setValueAtTime(freq, now);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.exponentialRampToValueAtTime(velocity * 0.7, now + 0.008);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                osc.connect(gain);
                gain.connect(this.masterGain);

                osc.start(now);
                osc.stop(now + duration + 0.05);
            }

            midiToNoteName(midi) {
                const names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
                const oct = Math.floor(midi / 12) - 1;
                return names[midi % 12] + oct;
            }

            playMetronomeClick(isDownbeat = false) {
                if (!this.synthCtx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.synthCtx = new AudioCtx();
                }
                if (this.synthCtx.state === "suspended") this.synthCtx.resume();

                const now = this.synthCtx.currentTime;
                const osc = this.synthCtx.createOscillator();
                const gain = this.synthCtx.createGain();

                osc.frequency.setValueAtTime(isDownbeat ? 1200 : 800, now);
                osc.type = "sine";

                gain.gain.setValueAtTime(0.7, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + (isDownbeat ? 0.035 : 0.025));

                osc.connect(gain);
                gain.connect(this.synthCtx.destination);

                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        const audio = new AudioPlayer();

        const pianoFrame = document.getElementById("pianoKeyboardFrame");
        const keyElementsMap = new Map();

        function buildVirtualPiano() {
            const START_MIDI = 36; // C2
            const END_MIDI = 84;   // C7
            const isBlackKey = [false, true, false, true, false, false, true, false, true, false, true, false];

            let whiteKeyIndex = 0;
            for (let m = START_MIDI; m <= END_MIDI; m++) {
                const nMod = m % 12;
                if (!isBlackKey[nMod]) {
                    const wKey = document.createElement("div");
                    wKey.className = "white-key";
                    wKey.dataset.midi = m;

                    if (nMod === 0) {
                        const lbl = document.createElement("span");
                        lbl.className = "white-key-label";
                        lbl.innerText = `C${Math.floor(m / 12) - 1}`;
                        wKey.appendChild(lbl);
                    }

                    wKey.addEventListener("mousedown", () => {
                        audio.init();
                        audio.playChord([m], 0.7, 0.9, true);
                        flashKeys([m], true, 400);
                    });

                    pianoFrame.appendChild(wKey);
                    keyElementsMap.set(m, wKey);
                    whiteKeyIndex++;
                }
            }

            whiteKeyIndex = 0;
            for (let m = START_MIDI; m <= END_MIDI; m++) {
                const nMod = m % 12;
                if (!isBlackKey[nMod]) {
                    whiteKeyIndex++;
                } else {
                    const bKey = document.createElement("div");
                    bKey.className = "black-key";
                    bKey.dataset.midi = m;
                    const leftPos = (whiteKeyIndex * 23) - 8 + 6;
                    bKey.style.left = `${leftPos}px`;

                    bKey.addEventListener("mousedown", (e) => {
                        e.stopPropagation();
                        audio.init();
                        audio.playChord([m], 0.7, 0.9, true);
                        flashKeys([m], true, 400);
                    });

                    pianoFrame.appendChild(bKey);
                    keyElementsMap.set(m, bKey);
                }
            }
        }

        buildVirtualPiano();

        function flashKeys(midiArray, isRightHand, durationMs = 300) {
            midiArray.forEach(m => {
                const el = keyElementsMap.get(m);
                if (!el) return;
                const activeClass = isRightHand ? "active-rh" : "active-lh";
                el.classList.add(activeClass);
                setTimeout(() => { el.classList.remove(activeClass); }, durationMs);
            });
        }

        // -------------------------------------------------------------
        // 4. EXACT SVG SHEET MUSIC ENGRAVER (100% MuseScore Matching)
        // -------------------------------------------------------------
        function midiToStaffY(midi, clef) {
            const diatonicStep = [0, 0, 1, 2, 2, 3, 3, 4, 5, 5, 6, 6];
            const octave = Math.floor(midi / 12) - 1;
            const pitchClass = midi % 12;
            const absoluteStep = octave * 7 + diatonicStep[pitchClass];

            if (clef === "treble") {
                // E4 is bottom line (y = 95)
                // diatonic step of E4 is 4 * 7 + diatonicStep[4] = 28 + 2 = 30
                const e4Step = 4 * 7 + diatonicStep[4];
                const stepDiff = absoluteStep - e4Step;
                return 95 - stepDiff * 5.1;
            } else {
                // G2 is bottom line (y = 243)
                // diatonic step of G2 is 2 * 7 + diatonicStep[7] = 14 + 4 = 18
                const g2Step = 2 * 7 + diatonicStep[7];
                const stepDiff = absoluteStep - g2Step;
                return 243 - stepDiff * 5.1;
            }
        }

        function renderSystemSVG(svgId, measureList, isFirstSystem, startMeasureNumber) {
            const svg = document.getElementById(svgId);
            if (!svg) return;
            let html = "";

            const W = 1000;
            const leftMargin = isFirstSystem ? 148 : 78;
            const usableWidth = W - leftMargin - 16;
            const measureWidth = usableWidth / measureList.length;

            const trebleLines = [54, 64, 75, 85, 95];
            const bassLines = [202, 212, 222, 232, 243];

            // 1. Grand Staff Left Brace and Barline
            html += `<line x1="36" y1="${trebleLines[0]}" x2="36" y2="${bassLines[4]}" stroke="#000" stroke-width="1.2"/>`;
            html += `<path d="M 28 54 C 23 54, 18 66, 18 84 L 18 135 C 18 144, 13 148, 8 149 C 13 150, 18 154, 18 163 L 18 214 C 18 232, 23 243, 28 243 C 24 241, 21 230, 21 214 L 21 163 C 21 152, 16 149, 12 149 C 16 148, 21 145, 21 135 L 21 84 C 21 68, 24 57, 28 54 Z" fill="#000"/>`;

            // Horizontal Staff Lines
            for (let i = 0; i < 5; i++) {
                html += `<line x1="36" y1="${trebleLines[i]}" x2="${W}" y2="${trebleLines[i]}" stroke="#111" stroke-width="1"/>`;
                html += `<line x1="36" y1="${bassLines[i]}" x2="${W}" y2="${bassLines[i]}" stroke="#111" stroke-width="1"/>`;
            }

            // Clefs in SMuFL Bravura
            html += `<text class="bravura" x="38" y="85" font-size="40" fill="#000">&#xE050;</text>`;
            html += `<text class="bravura" x="38" y="212" font-size="40" fill="#000">&#xE062;</text>`;

            if (isFirstSystem) {
                // Key Signature (3 flats in Treble and Bass)
                html += `<text class="bravura" x="80" y="75" font-size="40" fill="#000">&#xE260;</text>`;
                html += `<text class="bravura" x="93" y="60" font-size="40" fill="#000">&#xE260;</text>`;
                html += `<text class="bravura" x="106" y="80" font-size="40" fill="#000">&#xE260;</text>`;

                html += `<text class="bravura" x="80" y="232" font-size="40" fill="#000">&#xE260;</text>`;
                html += `<text class="bravura" x="93" y="217" font-size="40" fill="#000">&#xE260;</text>`;
                html += `<text class="bravura" x="106" y="237" font-size="40" fill="#000">&#xE260;</text>`;

                // 4/4 Time Signature
                html += `<text class="bravura" x="122" y="75" font-size="40" fill="#000">&#xE084;</text>`;
                html += `<text class="bravura" x="122" y="95" font-size="40" fill="#000">&#xE084;</text>`;
                html += `<text class="bravura" x="122" y="222" font-size="40" fill="#000">&#xE084;</text>`;
                html += `<text class="bravura" x="122" y="243" font-size="40" fill="#000">&#xE084;</text>`;

                // Tempo Mark: quarter = 70
                html += `<text class="bravura" x="120" y="38" font-size="28" fill="#000">&#xE1D5;</text>`;
                html += `<text class="music-text" x="138" y="36" font-size="21" font-weight="bold" fill="#000">= 70</text>`;
            } else {
                // Measure Number Badge at system start
                html += `<text class="music-text" x="20" y="36" font-size="14" font-style="italic" fill="#333">${startMeasureNumber}</text>`;
            }

            // Render Measures in this system
            measureList.forEach((m, mIdx) => {
                const mX = leftMargin + mIdx * measureWidth;
                const mRight = mX + measureWidth;

                // Vertical barlines
                html += `<line x1="${mRight}" y1="${trebleLines[0]}" x2="${mRight}" y2="${trebleLines[4]}" stroke="#111" stroke-width="1.2"/>`;
                html += `<line x1="${mRight}" y1="${bassLines[0]}" x2="${mRight}" y2="${bassLines[4]}" stroke="#111" stroke-width="1.2"/>`;

                // Dynamics (SMuFL Bravura: mp &#xE52C;, mf &#xE52B;, p &#xE52D;, f &#xE522;)
                if (m.dynamic) {
                    const dynMap = { "mp": "&#xE52C;", "mf": "&#xE52B;", "p": "&#xE52D;", "f": "&#xE522;", "pp": "&#xE52E;" };
                    const dynChar = dynMap[m.dynamic] || m.dynamic;
                    html += `<text class="bravura" x="${mX + 12}" y="125" font-size="32" fill="#000">${dynChar}</text>`;
                }
                if (m.crescendo) {
                    html += `<polygon points="${mX + 16},116 ${mRight - 16},108 ${mRight - 16},124" fill="none" stroke="#000" stroke-width="1.1"/>`;
                }

                // Pedal Line Bracket
                const pedY = 280;
                html += `<line x1="${mX + 8}" y1="${pedY - 14}" x2="${mX + 8}" y2="${pedY}" stroke="#222" stroke-width="1.2"/>`;
                html += `<line x1="${mX + 8}" y1="${pedY}" x2="${mRight - 8}" y2="${pedY}" stroke="#222" stroke-width="1.2"/>`;
                html += `<line x1="${mRight - 8}" y1="${pedY}" x2="${mRight - 8}" y2="${pedY - 10}" stroke="#222" stroke-width="1.2"/>`;

                const usableMWidth = measureWidth - 28;
                const noteStartX = mX + 14;
                const getBeatX = (b) => noteStartX + ((b - 1.0) / 4.0) * usableMWidth;

                // TREBLE ENGRAVING
                const isAccompanimentTriplet = (m.number <= 8);

                if (isAccompanimentTriplet) {
                    // Group triplets by beat
                    const tripGroups = {};
                    m.treble.forEach(n => {
                        const bInt = Math.floor(n.beat);
                        if (!tripGroups[bInt]) tripGroups[bInt] = [];
                        tripGroups[bInt].push(n);
                    });

                    Object.keys(tripGroups).forEach(bKey => {
                        const grp = tripGroups[bKey];
                        const bInt = parseInt(bKey);

                        if (bInt === 4 && m.number <= 2) {
                            // Beat 4 Sextuplet Flourish (M1, M2)
                            const x1 = getBeatX(4.0);
                            const x2 = getBeatX(4.33);
                            const x3 = getBeatX(4.60);
                            const x4 = getBeatX(4.82);

                            const melTopY = (m.number === 1) ? 48 : 54; // G5 or F5
                            const midNoteY = (m.number === 1) ? 60 : 65; // Eb5 or D5
                            const c5Y = (m.number === 1) ? 70 : 65;     // C5 or D5

                            html += `<text class="bravura" x="${x1 - 5.5}" y="${melTopY}" font-size="40" fill="#000">&#xE0A4;</text>`;
                            html += `<text class="bravura" x="${x1 - 5.5}" y="85" font-size="40" fill="#000">&#xE0A4;</text>`;
                            html += `<text class="bravura" x="${x2 - 5.5}" y="${c5Y}" font-size="40" fill="#000">&#xE0A4;</text>`;
                            html += `<text class="bravura" x="${x3 - 5.5}" y="${melTopY}" font-size="40" fill="#000">&#xE0A4;</text>`;
                            html += `<text class="bravura" x="${x3 - 5.5}" y="${midNoteY}" font-size="40" fill="#000">&#xE0A4;</text>`;
                            html += `<text class="bravura" x="${x4 - 5.5}" y="${melTopY}" font-size="40" fill="#000">&#xE0A4;</text>`;
                            html += `<text class="bravura" x="${x4 - 5.5}" y="${midNoteY}" font-size="40" fill="#000">&#xE0A4;</text>`;

                            const by1 = 113, by4 = 102;
                            const getBY = (x) => by1 + (by4 - by1) * ((x - x1) / (x4 - x1));

                            html += `<line x1="${x1 - 5.2}" y1="${melTopY}" x2="${x1 - 5.2}" y2="${by1}" stroke="#000" stroke-width="1.3"/>`;
                            html += `<line x1="${x2 - 5.2}" y1="${c5Y}" x2="${x2 - 5.2}" y2="${getBY(x2)}" stroke="#000" stroke-width="1.3"/>`;
                            html += `<line x1="${x3 - 5.2}" y1="${melTopY}" x2="${x3 - 5.2}" y2="${getBY(x3)}" stroke="#000" stroke-width="1.3"/>`;
                            html += `<line x1="${x4 - 5.2}" y1="${melTopY}" x2="${x4 - 5.2}" y2="${by4}" stroke="#000" stroke-width="1.3"/>`;

                            // Main beam
                            html += `<line x1="${x1 - 5.2}" y1="${by1}" x2="${x4 - 5.2}" y2="${by4}" stroke="#000" stroke-width="4.5"/>`;
                            // Secondary beam between stem 2 and stem 3
                            html += `<line x1="${x2 - 5.2}" y1="${getBY(x2) - 6.5}" x2="${x3 - 5.2}" y2="${getBY(x3) - 6.5}" stroke="#000" stroke-width="3.5"/>`;
                            // Slur arc
                            html += `<path d="M ${x2 - 2} ${c5Y - 6} Q ${(x2 + x3)/2} ${c5Y - 14}, ${x3 - 2} ${c5Y - 6}" fill="none" stroke="#000" stroke-width="1.3"/>`;
                            // Triplet "3"
                            html += `<text class="music-text" x="${(x1 + x4)/2}" y="128" font-size="14" font-style="italic" font-weight="bold" text-anchor="middle" fill="#000">3</text>`;
                        } else if (grp.length >= 3) {
                            const n1 = grp[0];
                            const n2 = grp[1];
                            const n3 = grp[2];

                            const x1 = getBeatX(n1.beat);
                            const x2 = getBeatX(n2.beat);
                            const x3 = getBeatX(n3.beat);

                            const y1 = midiToStaffY(n1.chord[0], "treble");
                            const y2 = midiToStaffY(n2.chord[0], "treble");
                            const y3 = midiToStaffY(n3.chord[0], "treble");

                            // Noteheads
                            html += `<text class="bravura" x="${x1 - 5.5}" y="${y1}" font-size="40" fill="#000">&#xE0A4;</text>`;
                            html += `<text class="bravura" x="${x2 - 5.5}" y="${y2}" font-size="40" fill="#000">&#xE0A4;</text>`;
                            html += `<text class="bravura" x="${x3 - 5.5}" y="${y3}" font-size="40" fill="#000">&#xE0A4;</text>`;

                            // Top melody note on Beat 1 (e.g. G5 or F5)
                            let topY1 = y1;
                            if (n1.chord.length > 1) {
                                topY1 = midiToStaffY(n1.chord[1], "treble");
                                html += `<text class="bravura" x="${x1 - 5.5}" y="${topY1}" font-size="40" fill="#000">&#xE0A4;</text>`;
                            }

                            // Accidentals
                            if (n1.accidental === "b") html += `<text class="bravura" x="${x1 - 16}" y="${y1}" font-size="34" fill="#000">&#xE260;</text>`;
                            if (n2.accidental === "b") html += `<text class="bravura" x="${x2 - 16}" y="${y2}" font-size="34" fill="#000">&#xE260;</text>`;
                            if (n3.accidental === "b") html += `<text class="bravura" x="${x3 - 16}" y="${y3}" font-size="34" fill="#000">&#xE260;</text>`;

                            // Downstems
                            const b_y1 = 110;
                            const b_y2 = 100;
                            const by_mid = b_y1 + (b_y2 - b_y1) * ((x2 - x1) / (x3 - x1));

                            html += `<line x1="${x1 - 5.2}" y1="${topY1}" x2="${x1 - 5.2}" y2="${b_y1}" stroke="#000" stroke-width="1.3"/>`;
                            html += `<line x1="${x2 - 5.2}" y1="${y2}" x2="${x2 - 5.2}" y2="${by_mid}" stroke="#000" stroke-width="1.3"/>`;
                            html += `<line x1="${x3 - 5.2}" y1="${y3}" x2="${x3 - 5.2}" y2="${b_y2}" stroke="#000" stroke-width="1.3"/>`;

                            // Beam
                            html += `<line x1="${x1 - 5.2}" y1="${b_y1}" x2="${x3 - 5.2}" y2="${b_y2}" stroke="#000" stroke-width="4.5"/>`;

                            // Triplet "3"
                            html += `<text class="music-text" x="${(x1 + x3)/2}" y="126" font-size="14" font-style="italic" font-weight="bold" text-anchor="middle" fill="#000">3</text>`;
                        }

                        // Lyrics
                        if (grp[0].lyric) {
                            html += `<text class="music-text" x="${getBeatX(grp[0].beat)}" y="154" font-size="17" fill="#000">${grp[0].lyric}</text>`;
                        }
                    });
                } else {
                    // Standard / Chords / Chorus / Sextuplet engraving (M9 to M31)
                    m.treble.forEach(n => {
                        const x = getBeatX(n.beat);

                        // Rolled chord wavy line
                        if (n.rolled) {
                            html += `<text class="bravura" x="${x - 16}" y="95" font-size="38" fill="#000">&#xE634;</text>`;
                        }

                        n.chord.forEach(midi => {
                            const y = midiToStaffY(midi, "treble");

                            // Ledger lines
                            if (y < 50) {
                                for (let lY = 44; lY >= y - 3; lY -= 10) {
                                    html += `<line x1="${x - 9}" y1="${lY}" x2="${x + 9}" y2="${lY}" stroke="#000" stroke-width="1.2"/>`;
                                }
                            }
                            if (y > 100) {
                                for (let lY = 105; lY <= y + 3; lY += 10) {
                                    html += `<line x1="${x - 9}" y1="${lY}" x2="${x + 9}" y2="${lY}" stroke="#000" stroke-width="1.2"/>`;
                                }
                            }

                            if (n.accidental === "b") {
                                html += `<text class="bravura" x="${x - 16}" y="${y}" font-size="34" fill="#000">&#xE260;</text>`;
                            }

                            // Notehead
                            const headChar = (n.dur === "half" || n.dur === "whole") ? "&#xE0A3;" : "&#xE0A4;";
                            html += `<text class="bravura" x="${x - 5.5}" y="${y}" font-size="40" fill="#000">${headChar}</text>`;
                        });

                        // Stems
                        if (n.dur !== "whole") {
                            const lowestY = Math.max(...n.chord.map(m => midiToStaffY(m, "treble")));
                            const highestY = Math.min(...n.chord.map(m => midiToStaffY(m, "treble")));
                            const stemUp = (lowestY >= 75);
                            const stemX = stemUp ? x + 5.2 : x - 5.2;
                            const stemYEnd = stemUp ? highestY - 30 : lowestY + 30;
                            html += `<line x1="${stemX}" y1="${stemUp ? lowestY : highestY}" x2="${stemX}" y2="${stemYEnd}" stroke="#000" stroke-width="1.3"/>`;
                        }

                        if (n.lyric) {
                            html += `<text class="music-text" x="${x}" y="154" font-size="16" fill="#000">${n.lyric}</text>`;
                        }
                    });
                }

                // BASS ENGRAVING
                m.bass.forEach((n, bIdx) => {
                    const x = getBeatX(n.beat);

                    if (n.rolled) {
                        html += `<text class="bravura" x="${x - 16}" y="235" font-size="38" fill="#000">&#xE634;</text>`;
                    }

                    n.chord.forEach(midi => {
                        const y = midiToStaffY(midi, "bass");

                        // Ledger lines
                        if (y > 250) {
                            for (let lY = 253; lY <= y + 3; lY += 10) {
                                html += `<line x1="${x - 9}" y1="${lY}" x2="${x + 9}" y2="${lY}" stroke="#000" stroke-width="1.2"/>`;
                            }
                        }
                        if (y < 195) {
                            for (let lY = 192; lY >= y - 3; lY -= 10) {
                                html += `<line x1="${x - 9}" y1="${lY}" x2="${x + 9}" y2="${lY}" stroke="#000" stroke-width="1.2"/>`;
                            }
                        }

                        if (n.accidental === "b") {
                            html += `<text class="bravura" x="${x - 16}" y="${y}" font-size="34" fill="#000">&#xE260;</text>`;
                        }

                        const headChar = (n.dur === "half" || n.dur === "whole") ? "&#xE0A3;" : "&#xE0A4;";
                        html += `<text class="bravura" x="${x - 5.5}" y="${y}" font-size="40" fill="#000">${headChar}</text>`;
                    });

                    if (n.dur !== "whole") {
                        const lowestY = Math.max(...n.chord.map(m => midiToStaffY(m, "bass")));
                        const highestY = Math.min(...n.chord.map(m => midiToStaffY(m, "bass")));

                        let stemUp = false;
                        if (isAccompanimentTriplet) {
                            stemUp = (bIdx >= 2); // Beat 1 & 2 DOWN, Beat 3 & 4 UP
                        } else {
                            stemUp = (lowestY >= 222);
                        }

                        const stemX = stemUp ? x + 5.2 : x - 5.2;
                        const stemYEnd = stemUp ? highestY - 32 : lowestY + 32;
                        html += `<line x1="${stemX}" y1="${stemUp ? lowestY : highestY}" x2="${stemX}" y2="${stemYEnd}" stroke="#000" stroke-width="1.3"/>`;
                    }
                });
            });

            svg.innerHTML = html;
        }

        // Render all 17 systems across all 4 pages
        SYSTEM_DEFINITIONS.forEach(def => {
            const mList = def.measures.map(mNum => SCORE_DATA[mNum - 1]);
            renderSystemSVG(`sys${def.sysIdx}Svg`, mList, def.isFirstInSong, def.measures[0]);
        });

        // -------------------------------------------------------------
        // 5. MASTER PLAYBACK ENGINE & SYNCHRONIZATION (31 Measures)
        // -------------------------------------------------------------
        let isPlaying = false;
        let isLooping = false;
        let isMetronomeOn = false;
        let speedMultiplier = 1.0;
        let baseBPM = 70;

        let currentMeasureIdx = 0; // 0..30
        let currentBeat = 1.0;     // 1.0 .. 5.0
        let lastTimestamp = 0;
        let animationFrameId = null;
        const playedNotesSet = new Set();
        let lastMetroBeatInt = 0;
        let lastActiveSysIdx = -1;

        // UI Element References
        const playBtn = document.getElementById("playBtn");
        const rewindBtn = document.getElementById("rewindBtn");
        const loopBtn = document.getElementById("loopBtn");
        const metronomeBtn = document.getElementById("metronomeBtn");
        const metroDot = document.getElementById("metroDot");
        const timelineSlider = document.getElementById("timelineSlider");
        const timeElapsedDisplay = document.getElementById("timeElapsedDisplay");
        const measurePill = document.getElementById("measurePill");

        // Hands Mixer Controls
        const rhMuteBtn = document.getElementById("rhMuteBtn");
        const rhSoloBtn = document.getElementById("rhSoloBtn");
        const rhVolSlider = document.getElementById("rhVolSlider");
        const lhMuteBtn = document.getElementById("lhMuteBtn");
        const lhSoloBtn = document.getElementById("lhSoloBtn");
        const lhVolSlider = document.getElementById("lhVolSlider");

        // Speed Buttons
        document.querySelectorAll(".speed-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".speed-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                speedMultiplier = parseFloat(btn.dataset.speed);
            });
        });

        // Hands Mixer Handlers
        rhMuteBtn.addEventListener("click", () => {
            audio.rhMute = !audio.rhMute;
            rhMuteBtn.classList.toggle("active", audio.rhMute);
        });
        rhSoloBtn.addEventListener("click", () => {
            audio.rhSolo = !audio.rhSolo;
            rhSoloBtn.classList.toggle("active", audio.rhSolo);
        });
        rhVolSlider.addEventListener("input", (e) => {
            audio.rhVol = parseInt(e.target.value) / 100.0;
            if (audio.rhGain) audio.rhGain.gain.value = audio.rhVol;
        });

        lhMuteBtn.addEventListener("click", () => {
            audio.lhMute = !audio.lhMute;
            lhMuteBtn.classList.toggle("active", audio.lhMute);
        });
        lhSoloBtn.addEventListener("click", () => {
            audio.lhSolo = !audio.lhSolo;
            lhSoloBtn.classList.toggle("active", audio.lhSolo);
        });
        lhVolSlider.addEventListener("input", (e) => {
            audio.lhVol = parseInt(e.target.value) / 100.0;
            if (audio.lhGain) audio.lhGain.gain.value = audio.lhVol;
        });

        // Loop & Metronome
        loopBtn.addEventListener("click", () => {
            isLooping = !isLooping;
            loopBtn.classList.toggle("active", isLooping);
        });

        metronomeBtn.addEventListener("click", () => {
            isMetronomeOn = !isMetronomeOn;
            metronomeBtn.classList.toggle("active", isMetronomeOn);
        });

        // Play/Pause/Rewind
        playBtn.addEventListener("click", () => {
            audio.init();
            if (isPlaying) {
                pausePlayback();
            } else {
                startPlayback();
            }
        });

        rewindBtn.addEventListener("click", () => {
            seekToBeat(0);
        });

        timelineSlider.addEventListener("input", (e) => {
            const totalBeats = parseFloat(e.target.value);
            seekToBeat(totalBeats);
        });

        // System row click to seek
        document.querySelectorAll(".system-row").forEach(row => {
            row.addEventListener("click", (e) => {
                const sysIdx = parseInt(row.dataset.system);
                const def = SYSTEM_DEFINITIONS.find(d => d.sysIdx === sysIdx);
                if (!def) return;

                const rect = row.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const pct = clickX / rect.width;
                const mInSys = Math.min(def.measures.length - 1, Math.max(0, Math.floor(pct * def.measures.length)));
                const targetMNum = def.measures[mInSys];
                seekToBeat((targetMNum - 1) * 4);
            });
        });

        // Keyboard shortcuts
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                e.preventDefault();
                playBtn.click();
            } else if (e.code === "KeyM") {
                metronomeBtn.click();
            } else if (e.code === "KeyL") {
                loopBtn.click();
            }
        });

        function startPlayback() {
            isPlaying = true;
            playBtn.innerText = "⏸";
            lastTimestamp = performance.now();
            lastMetroBeatInt = Math.floor(currentBeat);
            playedNotesSet.clear();

            triggerNotesInMeasure(currentMeasureIdx, currentBeat - 0.05, currentBeat + 0.05);
            animationFrameId = requestAnimationFrame(playbackLoop);
        }

        function pausePlayback() {
            isPlaying = false;
            playBtn.innerText = "▶";
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
        }

        function seekToBeat(totalBeats) {
            const mIdx = Math.min(30, Math.floor(totalBeats / 4));
            const beatInM = 1.0 + (totalBeats % 4);

            currentMeasureIdx = mIdx;
            currentBeat = beatInM;
            playedNotesSet.clear();
            lastMetroBeatInt = Math.floor(currentBeat);

            updateScrubberAndDisplay();
            updateCursorPosition();
        }

        function playbackLoop(timestamp) {
            if (!isPlaying) return;

            const dt = (timestamp - lastTimestamp) / 1000.0;
            lastTimestamp = timestamp;

            const currentBPM = baseBPM * speedMultiplier;
            const deltaBeats = (currentBPM / 60.0) * dt;

            const prevBeat = currentBeat;
            currentBeat += deltaBeats;

            // Metronome Click Check
            const currentBeatInt = Math.floor(currentBeat);
            if (currentBeatInt !== lastMetroBeatInt && currentBeatInt >= 1 && currentBeatInt <= 4) {
                lastMetroBeatInt = currentBeatInt;
                if (isMetronomeOn) {
                    const isDownbeat = (currentBeatInt === 1);
                    audio.playMetronomeClick(isDownbeat);

                    metroDot.className = `metronome-dot ${isDownbeat ? 'flash-downbeat' : 'flash-subbeat'}`;
                    setTimeout(() => { metroDot.className = "metronome-dot"; }, 100);
                }
            }

            // Boundary
            if (currentBeat >= 5.0) {
                currentMeasureIdx++;
                currentBeat = 1.0 + (currentBeat - 5.0);
                playedNotesSet.clear();
                lastMetroBeatInt = 1;

                if (isLooping && currentMeasureIdx > 30) {
                    currentMeasureIdx = 0;
                    currentBeat = 1.0;
                } else if (currentMeasureIdx >= SCORE_DATA.length) {
                    pausePlayback();
                    seekToBeat(0);
                    return;
                }

                triggerNotesInMeasure(currentMeasureIdx, 0.95, currentBeat + 0.05);
            } else {
                triggerNotesInMeasure(currentMeasureIdx, prevBeat, currentBeat);
            }

            updateScrubberAndDisplay();
            updateCursorPosition();

            animationFrameId = requestAnimationFrame(playbackLoop);
        }

        function triggerNotesInMeasure(mIdx, startB, endB) {
            const m = SCORE_DATA[mIdx];
            if (!m) return;

            // Treble (Right Hand)
            m.treble.forEach((n, idx) => {
                const key = `t-${mIdx}-${idx}-${n.beat}`;
                if (n.beat > startB && n.beat <= endB && !playedNotesSet.has(key)) {
                    playedNotesSet.add(key);
                    const dur = n.dur === "16th" ? 0.22 : (n.dur === "dottedQuarter" ? 1.0 : 0.55);
                    audio.playChord(n.chord, dur, n.triplet ? 0.8 : 0.95, true);
                    flashKeys(n.chord, true, Math.min(dur * 1000, 500));
                }
            });

            // Bass (Left Hand)
            m.bass.forEach((n, idx) => {
                const key = `b-${mIdx}-${idx}-${n.beat}`;
                if (n.beat > startB && n.beat <= endB && !playedNotesSet.has(key)) {
                    playedNotesSet.add(key);
                    const dur = n.dur === "16th" ? 0.25 : 0.75;
                    audio.playChord(n.chord, dur, 0.85, false);
                    flashKeys(n.chord, false, Math.min(dur * 1000, 600));
                }
            });
        }

        function updateScrubberAndDisplay() {
            const totalBeats = currentMeasureIdx * 4 + (currentBeat - 1.0);
            timelineSlider.value = totalBeats;

            const totalDurationSec = (124 / (baseBPM * speedMultiplier)) * 60;
            const elapsedSec = (totalBeats / (baseBPM * speedMultiplier)) * 60;

            const fmt = (s) => {
                const min = Math.floor(s / 60);
                const sec = Math.floor(s % 60);
                return `${String(min).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
            };

            timeElapsedDisplay.innerText = `${fmt(elapsedSec)} / ${fmt(totalDurationSec)}`;
            measurePill.innerText = `Compasso ${currentMeasureIdx + 1} / 31`;
        }

        function updateCursorPosition() {
            const mNum = currentMeasureIdx + 1;
            const def = SYSTEM_DEFINITIONS.find(d => d.measures.includes(mNum));
            if (!def) return;

            const sysIdx = def.sysIdx;
            const mInSys = def.measures.indexOf(mNum);
            const countInSys = def.measures.length;
            const leftMargin = def.isFirstInSong ? 86 : 64;

            // Hide inactive cursors
            for (let s = 0; s <= 16; s++) {
                const c = document.getElementById(`cursor${s}`);
                if (!c) continue;
                if (s === sysIdx && isPlaying) {
                    c.style.display = "block";
                } else {
                    c.style.display = "none";
                }
            }

            // Auto-scroll when system changes
            if (isPlaying && sysIdx !== lastActiveSysIdx) {
                lastActiveSysIdx = sysIdx;
                const rowEl = document.getElementById(`sysRow${sysIdx}`);
                if (rowEl) {
                    rowEl.scrollIntoView({ behavior: "smooth", block: "center" });
                }
            }

            if (!isPlaying) return;

            const cursor = document.getElementById(`cursor${sysIdx}`);
            if (!cursor) return;

            const W = 1000;
            const usableWidth = W - leftMargin - 16;
            const measureWidth = usableWidth / countInSys;
            const mX = leftMargin + mInSys * measureWidth;
            const usableMWidth = measureWidth - 36;
            const startX = mX + 18;

            const beatOffset = (currentBeat - 1.0) / 4.0;
            const x = startX + beatOffset * usableMWidth;

            const pct = (x / 1000.0) * 100.0;
            cursor.style.left = `${pct}%`;
        }
    </script>
</body>
</html>
